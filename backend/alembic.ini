# Alembic configuration.
#
# Run from backend/ (or any cwd: script_location is resolved via %(here)s):
#   ../.venv/Scripts/python.exe -m alembic upgrade head
#
# Keep this file ASCII-only: alembic reads it with the platform default encoding
# (GBK on this Windows box), so non-ASCII comments break config parsing.
#
# sqlalchemy.url is intentionally empty: the real URL is injected by alembic/env.py
# from Settings (backend/.env), so no DB credentials are ever committed.
# Integration tests inject a scratch database via config.set_main_option().

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S